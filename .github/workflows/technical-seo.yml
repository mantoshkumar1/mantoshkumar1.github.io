name: Technical SEO

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  knowledge-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/knowledge-sync-contract.test.mjs
      - run: node --test tests/release-workflows.test.mjs
      - run: node scripts/audit-knowledge-sync.mjs

  worker-toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Install locked Worker toolchain
        run: npm ci --prefix chat-worker
      - name: Reject high-severity advisories
        run: npm audit --prefix chat-worker --audit-level=high
      - name: Validate Worker bundle without deploying
        working-directory: chat-worker
        run: npx wrangler deploy --dry-run

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:protected-paths
      - run: npx playwright install --with-deps chromium
      - run: node scripts/generate-seo.mjs
      - run: node scripts/audit-homepage-insights.mjs
      - run: node scripts/audit-homepage-projects.mjs
      - run: node scripts/seo-audit.mjs
      - run: node scripts/validate-discoverability.mjs
      - run: node scripts/validate-xml-feeds.mjs
      - run: node scripts/audit-links.mjs
      - run: node scripts/audit-accessibility.mjs
      - run: node scripts/audit-docs.mjs
      - run: node scripts/audit-content-sections.mjs
      - run: node scripts/audit-ask-mantosh-coverage.mjs
      - run: npm test --prefix chat-worker
      - run: npm run test:browser
      - run: npm run audit:performance-budget
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
